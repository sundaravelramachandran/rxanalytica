<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow-aspire" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021f15" flood-opacity="0.38" />
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Trophy Gold Gradients -->
    <linearGradient id="gold-cup" x1="32" y1="20" x2="88" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4b8" />
      <stop offset="25%" stop-color="#ffd54f" />
      <stop offset="55%" stop-color="#ffb300" />
      <stop offset="85%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#d46b08" />
    </linearGradient>

    <linearGradient id="gold-rim" x1="35" y1="18" x2="85" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <linearGradient id="gold-handle-left" x1="16" y1="28" x2="38" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#b26a00" />
    </linearGradient>

    <linearGradient id="gold-handle-right" x1="104" y1="28" x2="82" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#b26a00" />
    </linearGradient>

    <!-- Pedestal Emerald / Marble Gradients -->
    <linearGradient id="pedestal-top" x1="46" y1="74" x2="74" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#b26a00" />
    </linearGradient>
    <linearGradient id="pedestal-base" x1="34" y1="88" x2="86" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#058501" />
      <stop offset="45%" stop-color="#034f01" />
      <stop offset="100%" stop-color="#0f291f" />
    </linearGradient>
    <linearGradient id="pedestal-trim" x1="32" y1="104" x2="88" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#fff1b0" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>
  </defs>

  <!-- Ambient Shadow Under Trophy -->
  <ellipse cx="60" cy="109" rx="30" ry="5.5" fill="#072017" opacity="0.45" />

  <!-- ==================== TROPHY BASE & PEDESTAL ==================== -->
  <!-- Bottom Gold Base Plate -->
  <rect x="34" y="102" width="52" height="6" rx="3" fill="url(#pedestal-trim)" stroke="#b26a00" stroke-width="0.8" />

  <!-- Emerald Marble Tier -->
  <path d="M40 88 L80 88 L84 102 L36 102 Z" fill="url(#pedestal-base)" filter="url(#shadow-aspire)" stroke="#57c501" stroke-width="0.8" />
  <!-- Marble subtle veining -->
  <path d="M46 91 L50 99 M68 90 L74 100" stroke="#57c501" stroke-width="0.8" opacity="0.3" stroke-linecap="round" />

  <!-- Gold Plaque on Pedestal -->
  <rect x="46" y="92" width="28" height="7" rx="2" fill="url(#gold-rim)" stroke="#b26a00" stroke-width="0.6" />
  <line x1="50" y1="95.5" x2="70" y2="95.5" stroke="#7a4100" stroke-width="1.2" stroke-linecap="round" />

  <!-- Pedestal Neck & Stem -->
  <path d="M53 74 L67 74 L65 88 L55 88 Z" fill="url(#pedestal-top)" />
  <!-- Stem Collar Rings -->
  <ellipse cx="60" cy="74" rx="9" ry="2.5" fill="#ffe082" stroke="#b26a00" stroke-width="0.6" />
  <ellipse cx="60" cy="81" rx="6" ry="2" fill="#ffd54f" />
  <ellipse cx="60" cy="88" rx="10" ry="2.8" fill="#ffe082" stroke="#b26a00" stroke-width="0.6" />

  <!-- ==================== TROPHY HANDLES ==================== -->
  <!-- Left Handle -->
  <path d="M37 28 C20 28 17 48 35 56 C37 57 38 55 38 53 C24 47 26 33 37 32 Z" fill="url(#gold-handle-left)" stroke="#b26a00" stroke-width="0.8" filter="url(#shadow-aspire)" />
  <!-- Right Handle -->
  <path d="M83 28 C100 28 103 48 85 56 C83 57 82 55 82 53 C96 47 94 33 83 32 Z" fill="url(#gold-handle-right)" stroke="#b26a00" stroke-width="0.8" filter="url(#shadow-aspire)" />

  <!-- ==================== MAIN TROPHY CUP ==================== -->
  <!-- Cup Body -->
  <path d="M34 22 C34 48 46 68 60 72 C74 68 86 48 86 22 Z" fill="url(#gold-cup)" filter="url(#shadow-aspire)" stroke="#b26a00" stroke-width="1" />

  <!-- Top Rim Opening (3D Depth Inside Cup) -->
  <ellipse cx="60" cy="22" rx="26" ry="7.5" fill="#8c4e00" stroke="#ffb300" stroke-width="1" />
  <ellipse cx="60" cy="22" rx="23" ry="5.5" fill="#5a3100" />

  <!-- Front Rim Lip Highlight -->
  <path d="M34 22 C34 27 46 30 60 30 C74 30 86 27 86 22 C86 25 74 28 60 28 C46 28 34 25 34 22 Z" fill="url(#gold-rim)" />

  <!-- Cup Glossy Glare Stripe -->
  <path d="M42 27 C42 45 49 60 56 68 C52 62 46 48 46 29 Z" fill="#ffffff" opacity="0.32" />

  <!-- ==================== EMBOSSED STAR ON CUP ==================== -->
  <!-- Star Glow Badge Backing -->
  <circle cx="60" cy="44" r="13" fill="#ffffff" opacity="0.12" />
  <circle cx="60" cy="44" r="10.5" fill="rgba(255,205,32,0.22)" stroke="#ffd54f" stroke-width="0.8" />

  <!-- 3D Gold Star Emblem -->
  <polygon points="60,36 63,42 69,43 64.5,47.5 66,54 60,50.5 54,54 55.5,47.5 51,43 57,42" fill="#fff4b8" stroke="#b26a00" stroke-width="0.8" filter="url(#glow-gold)" />
  <polygon points="60,37 62.5,42 67.5,42.8 63.8,46.5 65,52 60,49" fill="#ffffff" opacity="0.6" />

  <!-- Sparkles -->
  <!-- Sparkle 1 Top Left -->
  <path d="M28 17 L30 19.5 L28 22 L26 19.5 Z" fill="#fff4b8" opacity="0.9" />
  <!-- Sparkle 2 Top Right -->
  <path d="M90 14 L93 17.5 L90 21 L87 17.5 Z" fill="#ffd54f" opacity="0.95" />
</svg>