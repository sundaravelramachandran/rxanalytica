<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow-live" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021f15" flood-opacity="0.35" />
    </filter>
    <filter id="glow-mint" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Monitor Gradients -->
    <linearGradient id="mon-body" x1="20" y1="24" x2="100" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d8b67" />
      <stop offset="45%" stop-color="#245842" />
      <stop offset="100%" stop-color="#123527" />
    </linearGradient>
    <linearGradient id="mon-screen" x1="26" y1="30" x2="94" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#072218" />
      <stop offset="70%" stop-color="#0e3828" />
      <stop offset="100%" stop-color="#174e37" />
    </linearGradient>
    <linearGradient id="mon-rim" x1="20" y1="24" x2="100" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#95d5b2" />
      <stop offset="50%" stop-color="#66cb01" />
      <stop offset="100%" stop-color="#058501" />
    </linearGradient>
    <linearGradient id="mon-stand" x1="50" y1="84" x2="70" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#66cb01" />
      <stop offset="60%" stop-color="#245842" />
      <stop offset="100%" stop-color="#143729" />
    </linearGradient>
    <linearGradient id="signal-grad" x1="30" y1="10" x2="90" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffcd20" />
      <stop offset="50%" stop-color="#57c501" />
      <stop offset="100%" stop-color="#66cb01" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="32" y1="55" x2="88" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#57c501" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#ffcd20" />
      <stop offset="70%" stop-color="#57c501" />
      <stop offset="100%" stop-color="#66cb01" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Ambient Shadow Under Stand -->
  <ellipse cx="60" cy="108" rx="28" ry="5.5" fill="#072017" opacity="0.4" />

  <!-- Broadcasting Signal Waves (Emitting from top) -->
  <path d="M42 22 C47 16 73 16 78 22" stroke="url(#signal-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M35 15 C44 7 76 7 85 15" stroke="url(#signal-grad)" stroke-width="2.8" stroke-linecap="round" opacity="0.9" />
  <path d="M28 8 C41 -2 79 -2 92 8" stroke="url(#signal-grad)" stroke-width="2.8" stroke-linecap="round" opacity="0.45" />

  <!-- Monitor Stand Base -->
  <path d="M42 104 C42 101 48 99 60 99 C72 99 78 101 78 104 C78 106 72 108 60 108 C48 108 42 106 42 104 Z" fill="url(#mon-stand)" stroke="#57c501" stroke-width="1" />
  <!-- Stand Neck -->
  <path d="M56 82 L64 82 L66 101 L54 101 Z" fill="url(#mon-stand)" />
  <!-- Stand Neck Highlight -->
  <path d="M57 82 L61 82 L61 101 L57 101 Z" fill="#57c501" opacity="0.35" />

  <!-- Monitor Body (Outer 3D Shell) -->
  <rect x="20" y="26" width="80" height="58" rx="10" fill="url(#mon-body)" filter="url(#shadow-live)" stroke="url(#mon-rim)" stroke-width="1.5" />

  <!-- Inner Screen Bezel -->
  <rect x="24" y="30" width="72" height="50" rx="6" fill="url(#mon-screen)" />

  <!-- Screen Gloss Glare / Diagonal Reflection -->
  <path d="M26 32 L68 32 L44 78 L26 78 Z" fill="#ffffff" opacity="0.08" />

  <!-- Live Pulse Dot & "LIVE" Badge on Screen -->
  <rect x="30" y="36" width="28" height="11" rx="4" fill="#ffcd20" fill-opacity="0.18" stroke="#ffcd20" stroke-width="0.8" />
  <circle cx="35" cy="41.5" r="2.5" fill="#ff4d4d" filter="url(#glow-mint)" />
  <circle cx="35" cy="41.5" r="1.5" fill="#ffffff" />
  <!-- LIVE text -->
  <path d="M41 39 L41 44 L44 44 M46 39 L46 44 M48 39 L50 44 L52 39 M53 39 L56 39 M53 41.5 L55.5 41.5 M53 44 L56 44" stroke="#ffcd20" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Viewer Count Pill Top Right -->
  <rect x="74" y="36" width="18" height="11" rx="4" fill="rgba(255,255,255,0.12)" />
  <circle cx="79" cy="41.5" r="1.8" fill="#57c501" />
  <path d="M83 40 L88 40 M83 43 L87 43" stroke="#e2f5ec" stroke-width="0.9" stroke-linecap="round" />

  <!-- Dynamic Live Audio/Broadcast Waveform -->
  <path d="M30 60 Q36 46 42 60 T54 60 T66 60 T78 60 T90 60" fill="none" stroke="url(#wave-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M30 60 Q36 52 42 60 T54 60 T66 60 T78 60 T90 60" fill="none" stroke="#57c501" stroke-width="1" stroke-linecap="round" opacity="0.6" />

  <!-- Equalizer Bars at Screen Bottom -->
  <rect x="36" y="68" width="3" height="6" rx="1.5" fill="#57c501" />
  <rect x="42" y="65" width="3" height="9" rx="1.5" fill="#ffcd20" />
  <rect x="48" y="63" width="3" height="11" rx="1.5" fill="#57c501" />
  <rect x="54" y="66" width="3" height="8" rx="1.5" fill="#66cb01" />
  <rect x="60" y="62" width="3" height="12" rx="1.5" fill="#ffcd20" />
  <rect x="66" y="64" width="3" height="10" rx="1.5" fill="#57c501" />
  <rect x="72" y="67" width="3" height="7" rx="1.5" fill="#66cb01" />
  <rect x="78" y="65" width="3" height="9" rx="1.5" fill="#57c501" />

  <!-- Monitor Bottom Logo / Camera Dot -->
  <circle cx="60" cy="82" r="1.5" fill="#57c501" opacity="0.8" />
  <circle cx="60" cy="28.5" r="1.2" fill="#058501" />
</svg>