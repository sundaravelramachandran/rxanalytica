
name: Deploy RX Analytica One DEV

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: rx-analytica-dev-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Configure SSH
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEV_SSH_KEY" > "$HOME/.ssh/rx_deploy_key"
          chmod 600 "$HOME/.ssh/rx_deploy_key"
          ssh-keyscan -H "$DEV_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy React build to DEV
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          rsync -avz --delete \
            --chmod=F644,D755 \
            -e "ssh -i $HOME/.ssh/rx_deploy_key" \
            dist/ \
            "$DEV_USER@$DEV_HOST:/var/www/rx-analytica-dev/"
